<!DOCTYPE html>
<html lang="en">
<head>
{{> head}}
</head>
<body>
	<header>
		<div class="header_inner">
			<a href="/">‹ Back to overview</a>
			<h1 id="title">{{heading}}</h1>
			<p id="theme">{{theme}}</p>
			<p id="artists" class="artist_credit" hidden></p>
		</div>
{{> nav}}
	</header>

	<main>
		<!-- Slideshow: cover + all images/videos of the exhibition -->
		<div id="slideshow" class="slideshow exhibition_slideshow">

			<button id="prev" class="nav prev" aria-label="Previous image">‹</button>

			<div id="slide_content" class="slide_content"></div>

			<button id="next" class="nav next" aria-label="Next image">›</button>

			<div id="dots"></div>

		</div>

		<p id="description">{{descriptionText}}</p>

		<div id="gallery" class="gallery"></div>

		<!-- The artists of the exhibition with their short text and a link to their page -->
		<section id="about_artists" class="about_artists" hidden>
			<h2 class="section_title" id="about_artists_title">About the artist</h2>
			<div id="about_artists_list"></div>
		</section>

		<!-- Intro video of the exhibition, to watch again (below the photos) -->
		<section id="video" class="video_section" hidden>
			<h2 class="section_title">Video</h2>
			<div id="video_box" class="video_box"></div>
		</section>
	</main>

{{> footer}}

	<!-- Fullscreen view: opens when an image is clicked -->
	<div id="viewer" class="viewer" hidden>
		<button id="viewer_close" class="viewer_close" aria-label="Close">×</button>
		<img id="viewer_image" alt="">
	</div>

{{> scripts}}
	<script defer src="/js/slideshow.js"></script>
	<script defer src="/js/viewer.js"></script>
	<script defer src="/js/intro.js"></script>
	<script defer src="/js/exhibition.js"></script>
</body>
</html>
